        // Theme Toggle
        function initTheme() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');

            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            }

            themeToggleBtn.addEventListener('click', () => {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            });
        }

        function setupEventListeners() {
            const sidebarBtn = document.getElementById('toggle-sidebar');
            const sidebar = document.getElementById('sidebar');
            sidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });

            const navButtons = document.querySelectorAll('.unit-btn');
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetUnit = btn.dataset.unit;
                    state.activeUnit = targetUnit;
                    
                    navButtons.forEach(b => {
                        b.classList.remove('bg-brand-50', 'text-brand-700', 'dark:bg-slate-700', 'dark:text-white');
                        b.classList.add('text-slate-600', 'dark:text-slate-300');
                    });
                    btn.classList.add('bg-brand-50', 'text-brand-700', 'dark:bg-slate-700', 'dark:text-white');

                    if (window.innerWidth < 768) {
                        sidebar.classList.add('-translate-x-full');
                    }

                    renderContent();
                });
            });
        }

        function updateStatsUI() {
            document.getElementById('xp-count').innerText = state.xp;
            document.getElementById('streak-count').innerText = state.streak;

            const solvedTotal = state.solvedQuestions.size;
            const pct = Math.round((solvedTotal / 40) * 100);

            document.getElementById('solved-count').innerText = solvedTotal;
            document.getElementById('overall-progress-bar').style.width = `${pct}%`;
            document.getElementById('overall-progress-text').innerText = `${pct}%`;

            // Check badges (Unlocked when 5+ questions solved per unit)
            ['unit1', 'unit2', 'unit3', 'unit4'].forEach(u => {
                const solvedInUnit = questionBank[u].filter(q => state.solvedQuestions.has(q.id)).length;
                if (solvedInUnit >= 5) state.badges[u] = true;

                const el = document.getElementById(`badge-${u.replace('unit', 'u')}`);
                if (state.badges[u]) {
                    el.classList.remove('grayscale', 'opacity-40');
                    el.classList.add('scale-110');
                }
            });
        }

                case 'unit2': renderUnit2(container); break;
                case 'unit3': renderUnit3(container); break;
                case 'unit4': renderUnit4(container); break;
            }

            if (window.MathJax) MathJax.typesetPromise();
        }

        function updateExponentSim() {
            const rule = document.getElementById('exp-rule-select').value;
            const a = parseInt(document.getElementById('exp-a').value) || 1;
            const b = parseInt(document.getElementById('exp-b').value) || 1;
            const exprDisplay = document.getElementById('exp-expression-display');
            const expDisplay = document.getElementById('exp-explanation-display');

            if (rule === 'product') {
                exprDisplay.innerText = `x${toSuperscript(a)} × x${toSuperscript(b)} = x${toSuperscript(a + b)}`;
                expDisplay.innerText = `Add exponents: ${a} + ${b} = ${a + b}`;
            } else if (rule === 'quotient') {
                exprDisplay.innerText = `x${toSuperscript(a)} ÷ x${toSuperscript(b)} = x${toSuperscript(a - b)}`;
                expDisplay.innerText = `Subtract exponents: ${a} - ${b} = ${a - b}`;
            } else if (rule === 'power') {
                exprDisplay.innerText = `(x${toSuperscript(a)})${toSuperscript(b)} = x${toSuperscript(a * b)}`;
                expDisplay.innerText = `Multiply inner by outer exponent: ${a} × ${b} = ${a * b}`;
            } else if (rule === 'zero') {
                exprDisplay.innerText = `x⁰ = 1`;
                expDisplay.innerText = `Any non-zero expression raised to power 0 equals 1`;
            }
        }

        function toSuperscript(num) {
            const sups = {'-':'⁻', '0':'⁰', '1':'¹', '2':'²', '3':'³', '4':'⁴', '5':'⁵', '6':'⁶', '7':'⁷', '8':'⁸', '9':'⁹'};
            return String(num).split('').map(c => sups[c] || c).join('');
        }

                                </div>
                                <div class="p-3 bg-blue-50 dark:bg-blue-950/30 rounded-lg text-xs space-y-1">

        function drawLinearGraph() {
            const m = parseFloat(document.getElementById('m-slider').value);
            const b = parseFloat(document.getElementById('b-slider').value);
            
            document.getElementById('m-val-text').innerText = m;
            document.getElementById('b-val-text').innerText = b;

            let eq = 'y = ';
            if (m !== 0) eq += `${m === 1 ? '' : m === -1 ? '-' : m}x`;
            if (b > 0) eq += `${m !== 0 ? ' + ' : ''}${b}`;
            else if (b < 0) eq += ` - ${Math.abs(b)}`;
            else if (m === 0) eq += '0';
            document.getElementById('eq-formula').innerText = eq;

            const canvas = document.getElementById('linearCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            const originX = w / 2;
            const originY = h / 2;
            const scale = 20;

            ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#334155' : '#e2e8f0';
            ctx.lineWidth = 1;

            for (let x = 0; x < w; x += scale) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }
            for (let y = 0; y < h; y += scale) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, h); ctx.stroke();

            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const x1 = -10, y1 = m * x1 + b;
            const x2 = 10, y2 = m * x2 + b;

            ctx.moveTo(originX + x1 * scale, originY - y1 * scale);
            ctx.lineTo(originX + x2 * scale, originY - y2 * scale);
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(originX, originY - b * scale, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function calculateGeo() {
            const shape = document.getElementById('geo-shape').value;
            const d1 = parseFloat(document.getElementById('dim1').value) || 1;
            const d2 = parseFloat(document.getElementById('dim2').value) || 1;
            const label1 = document.getElementById('dim1-label');
            const volRes = document.getElementById('geo-vol-res');
            const saRes = document.getElementById('geo-sa-res');

            if (shape === 'cylinder') {
                label1.innerText = "Radius (r)";
                const vol = Math.PI * d1 * d1 * d2;
                const sa = 2 * Math.PI * d1 * d2 + 2 * Math.PI * d1 * d1;
                volRes.innerText = `Volume: ${vol.toFixed(2)} units³ (V = πr²h)`;
                saRes.innerText = `Surface Area: ${sa.toFixed(2)} units² (SA = 2πrh + 2πr²)`;
            } else {
                label1.innerText = "Length (l)";
                const width = 5;
                const vol = d1 * width * d2;
                const sa = 2 * (d1 * width + d1 * d2 + width * d2);
                volRes.innerText = `Volume: ${vol.toFixed(2)} units³ (Width = 5)`;
                saRes.innerText = `Surface Area: ${sa.toFixed(2)} units²`;
            }
        }

        function runCodeSim() {
            const out = document.getElementById('code-output');
            out.classList.remove('hidden');
            let sum = 0;
            let steps = "Tracing Loop:\n";
            [1, 2, 3, 4].forEach(i => {
                sum += i * 5;
                steps += `i = ${i} -> added ${i*5} -> sum = ${sum}\n`;
            });
            steps += `\nFinal output: ${sum}`;
            out.innerText = steps;
        }

        let currentChartInstance = null;
        function updateFinancialChart() {
            const P = parseFloat(document.getElementById('fin-p').value) || 1000;
            const r = (parseFloat(document.getElementById('fin-r').value) || 7) / 100;
            const t = parseInt(document.getElementById('fin-t').value) || 10;

            const labels = [];
            const simpleData = [];
            const compoundData = [];

            for (let yr = 0; yr <= t; yr++) {
                labels.push(`Year ${yr}`);
                simpleData.push(P + (P * r * yr));
                compoundData.push(P * Math.pow(1 + r, yr));
            }

            const ctx = document.getElementById('financialChart');
            if (!ctx) return;

            if (currentChartInstance) currentChartInstance.destroy();

            currentChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Compound Interest A=P(1+r)ᵗ',
                            data: compoundData,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            fill: true,
                            tension: 0.3
                        },
                        {
                            label: 'Simple Interest I=Prt',
                            data: simpleData,
                            borderColor: '#64748b',
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        // --- HINT & ANSWER CHECKING SYSTEM ---
        function showNextHint(qId) {
            const currentStep = activeHintState[qId] || 0;
            let question = null;
            Object.values(questionBank).forEach(unitQs => {
                const found = unitQs.find(q => q.id === qId);
                if (found) question = found;
            });

            if (!question || currentStep >= question.hints.length) return;

            const container = document.getElementById(`hints-container-${qId}`);
            const hintDiv = document.createElement('div');
            hintDiv.className = 'p-2.5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200 rounded-lg text-xs leading-relaxed';
            hintDiv.innerHTML = question.hints[currentStep];
            container.appendChild(hintDiv);

            activeHintState[qId] = currentStep + 1;
            document.getElementById(`hint-btn-${qId}`).innerHTML = `<i class="fa-solid fa-lightbulb"></i> Need a Step-by-Step Hint? (${activeHintState[qId]}/${question.hints.length})`;

            if (activeHintState[qId] >= question.hints.length) {
                document.getElementById(`hint-btn-${qId}`).classList.add('opacity-50', 'pointer-events-none');
            }

            if (window.MathJax) MathJax.typesetPromise();
        }

        function checkAnswer(unitKey, qId, selectedIdx) {
            let question = null;
            Object.values(questionBank).forEach(unitQs => {
                const found = unitQs.find(q => q.id === qId);
                if (found) question = found;
            });

            const feedback = document.getElementById(`feedback-${qId}`);
            feedback.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-red-100', 'text-red-800', 'dark:bg-emerald-950/60', 'dark:text-emerald-300', 'dark:bg-red-950/60', 'dark:text-red-300');

            if (selectedIdx === question.correct) {
                feedback.classList.add('bg-emerald-100', 'dark:bg-emerald-950/60', 'text-emerald-800', 'dark:text-emerald-300');
                feedback.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> <strong>Correct!</strong> ${question.explanation}`;
                
                if (!state.solvedQuestions.has(qId)) {
                    state.solvedQuestions.add(qId);
                    state.xp += question.difficulty === 'Easy' ? 20 : question.difficulty === 'Medium' ? 30 : 50;
                    updateStatsUI();
                }
            } else {
                feedback.classList.add('bg-red-100', 'dark:bg-red-950/60', 'text-red-800', 'dark:text-red-300');
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600 mr-1"></i> <strong>Not quite right.</strong> Check the hint guides below and try again!`;
            }

            if (window.MathJax) MathJax.typesetPromise();
        }
